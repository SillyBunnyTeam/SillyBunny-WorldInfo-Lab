<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>World Info Lab fixture</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        :root {
            --SmartThemeBlurTintColor: #202628;
            --SmartThemeChatTintColor: #282f31;
            --SmartThemeBotMesBlurTintColor: #30383a;
            --SmartThemeBodyColor: #e4e9e7;
            --SmartThemeEmColor: #aeb9b5;
            --SmartThemeBorderColor: #596462;
            --SmartThemeQuoteColor: #91b9a8;
        }
        body { min-height: 100vh; margin: 0; background: #151a1b; color: #e4e9e7; font-family: sans-serif; }
        #extensionsMenu { min-height: 44px; padding: 8px; }
        #extensions-settings-button > .drawer-toggle { margin: 0 8px 8px; }
        #fixture-extension-shell { width: min(760px, 100%); max-height: calc(100vh - 100px); margin-left: auto; overflow-y: auto; }
        #extensions_settings2 { padding: 8px; }
        .text_pole { margin: 5px 0; }
        .menu_button { margin: 4px 0; }
    </style>
</head>
<body>
    <nav id="extensionsMenu"></nav>
    <section id="extensions-settings-button" class="drawer">
        <button class="drawer-toggle" type="button">Extensions</button>
        <div id="fixture-extension-shell" class="sb-shell-panel-scroller" hidden>
            <main id="extensions_settings2"></main>
        </div>
    </section>
    <script type="module">
        import { deactivate, init } from '/index.js';
        import { __setHostForTests } from '/src/host.js';

        const shellPanel = document.getElementById('fixture-extension-shell');
        const shellCalls = [];
        let fallbackClicks = 0;
        let popupCalls = 0;
        let drawerAnimation = 0;

        function showExtensions() {
            shellPanel.hidden = false;
        }

        const shellApi = {
            openTab(side, tab) {
                shellCalls.push([side, tab]);
                if (side === 'right' && tab === 'extensions') {
                    showExtensions();
                }
            },
        };
        globalThis.SillyBunnyShell = shellApi;

        document.querySelector('#extensions-settings-button > .drawer-toggle').addEventListener('click', () => {
            fallbackClicks += 1;
            shellPanel.hidden = !shellPanel.hidden;
        });
        document.addEventListener('click', (event) => {
            const toggle = event.target.closest('.inline-drawer-toggle');
            if (!(toggle instanceof HTMLElement)) {
                return;
            }
            const drawer = toggle.closest('.inline-drawer');
            const icon = drawer?.querySelector(':scope > .inline-drawer-header .inline-drawer-icon');
            const content = drawer?.querySelector(':scope > .inline-drawer-content');
            if (!(drawer instanceof HTMLElement) || !(icon instanceof HTMLElement) || !(content instanceof HTMLElement)) {
                return;
            }
            const expand = icon.classList.contains('down');
            icon.classList.toggle('down', !expand);
            icon.classList.toggle('up', expand);
            icon.classList.toggle('fa-circle-chevron-down', !expand);
            icon.classList.toggle('fa-circle-chevron-up', expand);
            content.style.display = expand ? 'block' : 'none';
            drawer.dispatchEvent(new CustomEvent('inline-drawer-toggle', { bubbles: true }));
            if (expand && drawerAnimation > 0) {
                content.animate([
                    { height: '0px', overflow: 'hidden' },
                    { height: `${content.scrollHeight}px`, overflow: 'hidden' },
                ], {
                    duration: drawerAnimation,
                    easing: 'linear',
                });
            }
        });

        const settings = {
            world_info_depth: 2,
            world_info_min_activations: 0,
            world_info_min_activations_depth_max: 0,
            world_info_budget: 25,
            world_info_budget_cap: 0,
            world_info_include_names: true,
            world_info_recursive: true,
            world_info_case_sensitive: false,
            world_info_match_whole_words: false,
            world_info_use_group_scoring: false,
            world_info_character_strategy: 1,
            world_info_max_recursion_steps: 5,
        };
        const book = {
            entries: {
                0: {
                    uid: 0,
                    key: ['dragon'],
                    keysecondary: [],
                    comment: 'Dragon fact',
                    content: 'Dragons keep maps.',
                    order: 100,
                    position: 0,
                    probability: 100,
                    useProbability: true,
                },
                1: {
                    uid: 1,
                    key: ['maps'],
                    keysecondary: [],
                    comment: 'Recursive map fact',
                    content: 'The map marks a vault.',
                    order: 90,
                    position: 4,
                    depth: 2,
                    probability: 100,
                    useProbability: true,
                },
            },
        };

        class ForbiddenPopup {
            constructor() {
                popupCalls += 1;
                throw new Error('The embedded workbench must not create a popup.');
            }
        }

        const eventTypes = {
            APP_READY: 'app-ready',
            CHAT_CHANGED: 'chat-changed',
            MESSAGE_EDITED: 'message-edited',
            SETTINGS_UPDATED: 'settings-updated',
            WORLDINFO_SETTINGS_UPDATED: 'worldinfo-settings-updated',
            WORLDINFO_UPDATED: 'worldinfo-updated',
        };
        const listeners = new Map();
        const accountValues = new Map();
        let loadDelay = 0;
        const eventSource = {
            on(type, handler) {
                const handlers = listeners.get(type) ?? new Set();
                handlers.add(handler);
                listeners.set(type, handlers);
            },
            removeListener(type, handler) {
                listeners.get(type)?.delete(handler);
            },
            async emit(type, ...args) {
                for (const handler of [...(listeners.get(type) ?? [])]) {
                    await handler(...args);
                }
            },
        };

        const context = {
            accountStorage: {
                getItem: key => accountValues.get(key) ?? null,
                setItem: (key, value) => accountValues.set(key, String(value)),
                removeItem: key => accountValues.delete(key),
            },
            characterId: 0,
            characters: [{ avatar: 'tester.png', data: { extensions: {} } }],
            chat: [{ mes: 'A dragon arrived.', name: 'User', is_user: true }],
            chatMetadata: {},
            extensionPrompts: {},
            extensionSettings: {},
            eventSource,
            eventTypes,
            maxContext: 4096,
            name1: 'User',
            name2: 'Tester',
            Popup: ForbiddenPopup,
            POPUP_TYPE: { TEXT: 'text' },
            powerUserSettings: {},
            tagMap: {},
            worldInfoSettings: { globalSelect: ['Fixture Book'], charLore: [] },
            getCharacterCardFields: () => ({}),
            getTokenCountAsync: async text => Math.ceil(String(text).length / 4),
            getWorldInfoNames: () => ['Fixture Book'],
            loadWorldInfo: async () => {
                if (loadDelay > 0) {
                    await new Promise(resolve => setTimeout(resolve, loadDelay));
                }
                return structuredClone(book);
            },
            reloadWorldInfoEditor: async () => {},
            saveSettingsDebounced: () => {},
            saveWorldInfo: async (name, value) => Object.assign(book, structuredClone(value)),
            substituteParams: value => value,
            updateWorldInfoList: () => {},
        };
        globalThis.SillyTavern = { getContext: () => context };
        __setHostForTests({
            ok: true,
            warnings: [],
            worldInfo: {
                selected_world_info: ['Fixture Book'],
                getWorldInfoSettings: () => settings,
                parseRegexFromString: () => null,
                world_info_position: {
                    before: 0,
                    after: 1,
                    ANTop: 2,
                    ANBottom: 3,
                    atDepth: 4,
                    EMTop: 5,
                    EMBottom: 6,
                    outlet: 7,
                },
            },
            scanCore: {
                normalizeWorldInfoProbability: entry => ({
                    ...entry,
                    probability: entry.probability ?? 100,
                    useProbability: entry.useProbability ?? true,
                }),
            },
            scanChat: { buildWorldInfoScanChat: () => [] },
            characterBook: { normalizeWorldInfoPosition: value => Number(value) },
            regex: null,
            utils: {
                getCharaFilename: () => 'tester',
                getStringHash: value => String(value).length,
            },
            tags: { getTagKeyForEntity: () => null },
            script: { getMaxPromptTokens: () => 4096 },
        });

        globalThis.fixtureDeactivate = deactivate;
        globalThis.fixtureEmit = (...args) => eventSource.emit(...args);
        globalThis.fixtureGetRouting = () => ({
            shellCalls: structuredClone(shellCalls),
            fallbackClicks,
            popupCalls,
        });
        globalThis.fixtureCloseShell = () => { shellPanel.hidden = true; };
        globalThis.fixtureOpenShell = showExtensions;
        globalThis.fixtureRemoveShellApi = () => { delete globalThis.SillyBunnyShell; };
        globalThis.fixtureSetDrawerAnimation = value => { drawerAnimation = Number(value) || 0; };
        globalThis.fixtureSetLoadDelay = value => { loadDelay = Number(value) || 0; };
        globalThis.fixtureSetTagMap = value => { context.tagMap = structuredClone(value); };
        init();
        await eventSource.emit(eventTypes.APP_READY);
    </script>
</body>
</html>
