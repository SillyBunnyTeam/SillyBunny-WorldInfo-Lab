name: CI

on:
    push:
    pull_request:

jobs:
    unit:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [20, 22]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npm test

    host-and-browser:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/checkout@v4
              with:
                  repository: SillyBunnyTeam/SillyBunny
                  ref: staging
                  path: .host/SillyBunny
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: SILLYBUNNY_ROOT="$PWD/.host/SillyBunny" npm run test:host
            - run: npx playwright install --with-deps chromium webkit
            - run: npm run test:browser:all
